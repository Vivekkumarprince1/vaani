name: Deploy backend to OCI

on:
  push:
    branches: [v2]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Build Linux binaries
        working-directory: backend
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags='-s -w' -o server-release ./cmd/server
          go build -trimpath -ldflags='-s -w' -o migrate-release ./cmd/migrate

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: |
            backend/server-release
            backend/migrate-release
            backend/migrations/*.sql
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, vaani-oci]
    timeout-minutes: 15
    environment: vaani-v2
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: release

      - name: Install, migrate, restart, and smoke test
        run: |
          sudo /usr/local/sbin/vaani-deploy
