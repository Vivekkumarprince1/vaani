global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

# Add email, Slack, PagerDuty, or webhook settings here before depending on
# external incident notifications. Alerts remain visible in Alertmanager and
# Grafana until a receiver is configured.
receivers:
  - name: default
